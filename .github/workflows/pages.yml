name: Deploy to GitHub Pages

# Optional: publishes index.html and bot.html. Pages on a private repo needs a
# paid GitHub plan; without it, open the pages from a local copy instead.
on:
  push:
    branches: [main]
    paths: ["index.html", "bot.html", "data/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Collect site files
        run: mkdir _site && cp -r index.html bot.html data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
